name: Publish React alongside classic app
on:
  push:
    branches: [main]
    paths:
      - 'react-app/**'
      - '.github/workflows/publish-react.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build React
        working-directory: react-app
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit generated /react/ to main for existing GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f react/
          if git diff --cached --quiet; then
            echo "No changes in published React bundle"
          else
            git commit -m "build: publish React app alongside classic recipes [skip ci]"
            git push origin HEAD:main
          fi
